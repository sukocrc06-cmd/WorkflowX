<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="WorkFlowX — işini, projelerini ve zamanını tek akışta planla.">
<meta name="theme-color" content="#f6f6f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0e0f12" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="WorkFlowX">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<body>
<div id="landing" hidden></div>

<div id="app">
  <button type="button" class="skip" data-a="skip" data-t="İçeriğe geç"></button>
  <aside class="side" aria-label="Sidebar"><div id="navind"></div><div id="sidein"></div></aside>
  <div style="min-width:0">
    <header class="top">
      <button class="search" data-a="cmdk" id="searchbtn"><svg class="i" data-icon="search"></svg><span data-t="Ara veya komut çalıştır…"></span><kbd>Ctrl K</kbd></button>
      <div class="spacer"></div>
      <a class="demo-chip" id="demochip" href="#/app/settings/data" hidden></a>
      <span class="sync" id="sync" role="status" aria-live="polite" hidden></span>
      <div class="timer" id="timer" role="group" aria-label="Zamanlayıcı" hidden></div>
      <div style="position:relative">
        <button class="btn icon ghost bell" data-a="bell" id="bellbtn"><svg class="i" data-icon="bell"></svg><span class="dot" id="belldot" hidden></span></button>
        <div id="notif" class="pop right" hidden></div>
      </div>
      <button class="btn primary" data-a="quick" id="qabtn"></button>
      <button class="avatar" data-a="go" data-v="settings" id="av">?</button>
    </header>
    <div id="netbar" class="netbar" role="status" hidden></div>
    <main id="main" tabindex="-1"></main>
  </div>
  <nav class="mob-nav" id="mobnav" aria-label="Mobile"></nav>
  <button type="button" class="fab" id="fab" data-a="quick"><svg class="i" data-icon="plus"></svg></button>
  <div id="more" hidden></div>
</div>

<dialog id="dlg"></dialog>
<dialog id="cmdk" aria-label="Command palette"></dialog>
<div id="toasts" aria-live="polite"></div>
